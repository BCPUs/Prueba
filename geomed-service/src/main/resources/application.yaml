spring:
  application:
    name: geomed-service

  datasource:
    url: jdbc:postgresql://db:5432/geomeddb
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_8jy9uMzmw

server:
  port: 8788

logging:
  level:
    org.springframework.security: INFO
