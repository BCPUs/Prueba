version: '3.8'

services:
  users-db:
    image: postgres:16-alpine
    container_name: users_db
    environment:
      POSTGRES_DB: usersdb
      POSTGRES_USER: ${USERS_DB_USER:-users_admin}
      POSTGRES_PASSWORD: ${USERS_DB_PASS:-users_password}
    expose:
      - "5432"
    volumes:
      - users_data:/var/lib/postgresql/data
    command: >
      postgres
      -c log_statement=all
      -c log_duration=on
      -c log_line_prefix='%m [%p] %u@%d app=%a '
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER:-users_admin} -d usersdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - geomed_network

  geomed-db:
    image: postgres:16-alpine
    container_name: geomed_db
    environment:
      POSTGRES_DB: geomeddb
      POSTGRES_USER: ${GEOMED_DB_USER:-geomed_admin}
      POSTGRES_PASSWORD: ${GEOMED_DB_PASS:-geomed_password}
    expose:
      - "5432"
    volumes:
      - geomed_data:/var/lib/postgresql/data
    command: >
      postgres
      -c log_statement=all
      -c log_duration=on
      -c log_line_prefix='%m [%p] %u@%d app=%a '
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GEOMED_DB_USER:-geomed_admin} -d geomeddb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - geomed_network

  users-service:
    build:
      context: ./users-service
    container_name: users_service_app
    expose:
      - "8787"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://users-db:5432/usersdb
      - SPRING_DATASOURCE_USERNAME=${USERS_DB_USER:-users_admin}
      - SPRING_DATASOURCE_PASSWORD=${USERS_DB_PASS:-users_password}
      - COGNITO_ISSUER_URI=${COGNITO_ISSUER_URI}
    depends_on:
      users-db:
        condition: service_healthy
    networks:
      - geomed_network

  geomed-service:
    build:
      context: ./geomed-service
    container_name: geomed_service_app
    expose:
      - "8788"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://geomed-db:5432/geomeddb
      - SPRING_DATASOURCE_USERNAME=${GEOMED_DB_USER:-geomed_admin}
      - SPRING_DATASOURCE_PASSWORD=${GEOMED_DB_PASS:-geomed_password}
      - COGNITO_ISSUER_URI=${COGNITO_ISSUER_URI}
    depends_on:
      geomed-db:
        condition: service_healthy
    networks:
      - geomed_network

  nginx:
    image: nginx:alpine
    container_name: geomed_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      users-service:
        condition: service_started
      geomed-service:
        condition: service_started
    networks:
      - geomed_network

volumes:
  users_data:
  geomed_data:

networks:
  geomed_network:
    driver: bridge